spring.application.name=fulbito-api
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Se mantiene desactivado en desarrollo local. Activar detras de un proxy HTTPS en staging/produccion.
app.security.require-https=${REQUIRE_HTTPS:false}

# La URL JDBC no incluye usuario ni contrasena. Los secretos se reciben por entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# La base ya existe: Hibernate solo valida que las entidades coincidan con ella.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC-3
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${SHOW_SQL:false}

# Compatibilidad con la base original, creada antes de Flyway: una base existente
# sin historial se registra como V1. Una base vacia se crea desde B4 y las futuras
# modificaciones se agregan como migraciones V5, V6, etc., sin borrar datos.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.url=${FLYWAY_DB_URL:${DB_URL}}
spring.flyway.user=${FLYWAY_DB_USERNAME:${DB_USERNAME}}
spring.flyway.password=${FLYWAY_DB_PASSWORD:${DB_PASSWORD}}

# Debe tener al menos 32 caracteres. En produccion debe ser aleatorio y secreto.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:PT2H}

# Origen de Expo web/desarrollo. Para apps nativas CORS no aplica, pero si para navegador.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

# El secreto se usa unicamente para firmar y eliminar recursos desde la API.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${APP_OPENAPI_ENABLED:false}
springdoc.api-docs.enabled=${APP_OPENAPI_ENABLED:false}

# Limites defensivos para evitar solicitudes desproporcionadas.
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=1MB
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
server.compression.min-response-size=2KB
