spring.application.name=fulbito-api
server.port=${PORT:8080}

# La URL JDBC no incluye usuario ni contrasena. Los secretos se reciben por entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# La base ya existe: Hibernate solo valida que las entidades coincidan con ella.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC-3
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${SHOW_SQL:false}

# La base inicial es anterior a Flyway. Se registra como version 1 y desde ahi
# se aplican migraciones incrementales sin borrar datos.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Debe tener al menos 32 caracteres. En produccion debe ser aleatorio y secreto.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:PT8H}

# Origen de Expo web/desarrollo. Para apps nativas CORS no aplica, pero si para navegador.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
